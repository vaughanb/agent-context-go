name: release

# Build prebuilt CGO binaries for each OS/arch and attach them to a GitHub
# Release when a v* tag is pushed. tree-sitter needs CGO, so each target is
# built on a matching native runner (or cross-compiled with the right C
# toolchain) rather than via pure Go cross-compilation.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest, goos: linux, goarch: amd64, ext: "" }
          - { name: linux-arm64, os: ubuntu-latest, goos: linux, goarch: arm64, ext: "", cc: aarch64-linux-gnu-gcc, apt: gcc-aarch64-linux-gnu }
          - { name: darwin-amd64, os: macos-13, goos: darwin, goarch: amd64, ext: "" }
          - { name: darwin-arm64, os: macos-14, goos: darwin, goarch: arm64, ext: "" }
          - { name: windows-amd64, os: windows-latest, goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          out="agent-context-go_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$out" ./cmd/agent-context-go

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            install.sh
            install.ps1
