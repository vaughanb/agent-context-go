name: release

# Build prebuilt CGO binaries for each OS/arch and publish them to a GitHub
# Release when a v* tag is pushed. Each architecture uploads its own binary to
# the release the moment it finishes building, so a slow or queued runner (e.g.
# the Intel-mac leg) never holds up the others. tree-sitter needs CGO, so each
# target is built on a matching native runner or cross-compiled with the right
# C toolchain rather than via pure-Go cross-compilation.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release and attach install scripts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" install.sh install.ps1 --repo "$REPO" --clobber

  build:
    name: build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-latest, goos: linux, goarch: amd64, ext: "" }
          - { name: linux-arm64, os: ubuntu-latest, goos: linux, goarch: arm64, ext: "", cc: aarch64-linux-gnu-gcc, apt: gcc-aarch64-linux-gnu }
          - { name: darwin-amd64, os: macos-13, goos: darwin, goarch: amd64, ext: "" }
          - { name: darwin-arm64, os: macos-14, goos: darwin, goarch: arm64, ext: "" }
          - { name: windows-amd64, os: windows-latest, goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross toolchain
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build and publish this architecture
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          out="agent-context-go_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$out" ./cmd/agent-context-go
          # Publish as soon as this leg is built — independent of the others.
          gh release upload "$TAG" "dist/$out" --repo "$REPO" --clobber

  checksums:
    name: publish checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$REPO" --pattern 'agent-context-go_*'
          sha256sum agent-context-go_* > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber
